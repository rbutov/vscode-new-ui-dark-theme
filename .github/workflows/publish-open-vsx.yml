name: Publish to Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish to Open VSX
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: open-vsx-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Open VSX publishing access
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Configure the OVSX_PAT repository secret before publishing to Open VSX.'
            exit 1
          fi

      - name: Download the released VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern theme.vsix --dir package -- "$RELEASE_TAG"

      - name: Verify the extension identity and release version
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile

          with zipfile.ZipFile('package/theme.vsix') as package:
              manifest = json.loads(package.read('extension/package.json'))
          expected_version = os.environ['RELEASE_TAG'].removeprefix('v')
          if manifest.get('publisher') != 'butov-dev' or manifest.get('name') != 'new-ui-dark-theme':
              raise SystemExit('The VSIX does not contain butov-dev.new-ui-dark-theme.')
          if manifest.get('version') != expected_version:
              raise SystemExit('The VSIX version does not match the release tag.')
          print(f"Verified butov-dev.new-ui-dark-theme {expected_version}.")
          PY

      - name: Publish the released package to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish package/theme.vsix --skip-duplicate
